name: Talia P0 checks
on:
  push:
    branches: [fix/local-codex-p0-reliability]
  pull_request:
    paths:
      - 'src/**'
      - 'frontend/**'
      - 'pom.xml'
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify typed Codex codec boundaries
        run: |
          if grep -R -nE '(^|[^[:alnum:]_])var[[:space:]]' src/main/java --include='*.java'; then
            echo 'Java var declarations are not permitted.'
            exit 1
          fi
          NON_CODEC_JSON=$(grep -Rl 'tools.jackson.databind.JsonNode' \
            src/main/java/com/chatbot/talia/ws/adapter/codex --include='*.java' \
            | grep -v '/protocol/CodexMessageCodec.java' || true)
          if [ -n "$NON_CODEC_JSON" ]; then
            echo 'JsonNode may only be used within CodexMessageCodec:'
            echo "$NON_CODEC_JSON"
            exit 1
          fi
      - name: Run tests
        run: bash ./mvnw -B test
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
        working-directory: frontend
      - run: corepack pnpm build
        working-directory: frontend
