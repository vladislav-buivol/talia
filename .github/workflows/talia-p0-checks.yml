name: Talia P0 checks
on:
  push:
    branches: [fix/local-codex-p0-reliability]
  pull_request:
    paths:
      - 'src/**'
      - 'frontend/**'
      - 'pom.xml'
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run tests
        run: bash ./mvnw -B test
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
        working-directory: frontend
      - run: corepack pnpm build
        working-directory: frontend
