# Disable Spring AI model providers in Codex mode
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none
# Disable ChatClient auto-configuration
spring.ai.chat.client.enabled=false
talia.codex.url=ws://127.0.0.1:4222
talia.codex.client.name=${spring.application.name}
talia.codex.client.title=Talia
talia.codex.client.version=0.1.0
