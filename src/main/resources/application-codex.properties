# Disable Spring AI model providers in Codex mode
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none
# Disable ChatClient auto-configuration
spring.ai.chat.client.enabled=false
talia.codex.url=ws://127.0.0.1:4222
talia.codex.client.name=${spring.application.name}
talia.codex.client.title=Talia
talia.codex.client.version=0.1.0
talia.chat.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# Local P0 protocol settings
talia.codex.rpc-timeout=15s
talia.codex.turn-start-timeout=30s
talia.codex.interrupt-timeout=5s
talia.codex.approval-timeout=90s
talia.codex.connect-timeout=5s
talia.codex.send-timeout=10s
talia.codex.max-early-notifications=128

# Local-only WebSocket server and bounded transport
server.address=127.0.0.1
talia.codex.send-queue-capacity=64
talia.codex.max-message-bytes=2097152
talia.codex.close-timeout=2s
